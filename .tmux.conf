# Give tmux sessions access to the macOS Keychain and system pasteboard.
# Wraps the login shell with reattach-to-user-namespace so processes inside
# tmux are bound to the GUI login session's bootstrap namespace.
set -g default-command "reattach-to-user-namespace -l $SHELL"

# Allow switching between tmux 'windows' with mouse click:
set -g mouse on
